name: linux-quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: linux-quality / quality-gate
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        env:
          ARLEN_CI_GNUSTEP_STRATEGY: preinstalled
        run: |
          bash ./tools/ci/install_ci_dependencies.sh

      - name: Install PostgreSQL server tools for isolated acceptance
        run: |
          if ! bash tools/ci/resolve_postgres_test_bin.sh; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          bash tools/ci/resolve_postgres_test_bin.sh

      - name: Verify durable jobs concurrency, crash recovery, and database outages
        run: |
          source tools/source_gnustep_env.sh
          make ci-durable-jobs

      - name: Verify live PostgreSQL CLI, search, and auth cleanup regressions
        run: |
          bash ./tools/ci/run_postgres_regressions.sh

      - name: Run linux quality gate
        env:
          GNUSTEP_USER_ROOT: ${{ github.workspace }}/.gnustep
          ARLEN_PERF_BASELINE_ROOT: tests/performance/baselines/iep-apt
        run: |
          bash ./tools/ci/run_linux_quality_gate.sh

      - name: Verify OAuth socket transport, maintenance, synthetic discovery and MCP HTTP examples
        run: |
          source tools/source_gnustep_env.sh
          make oauth-check mcp-check

      - name: Verify generated ORM models and live quoted-identifier persistence
        run: |
          source tools/source_gnustep_env.sh
          bash tools/ci/run_orm_identifier_regressions.sh

      - name: Verify ops builds with optional modules absent
        run: |
          source tools/source_gnustep_env.sh
          make test-integration-filter TEST=OpsOptionalModulesIntegrationTests

      - name: Verify configurable OIDC login and bounded token transport
        run: |
          source tools/source_gnustep_env.sh
          make test-unit-filter TEST=AuthModuleOIDCTests
          make test-unit-filter TEST=MetadataTransportTests

      - name: Upload perf + confidence artifacts
        if: github.event_name == 'workflow_dispatch' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-quality-artifacts-${{ github.run_id }}
          path: |
            build/perf
            build/release_confidence
            tests/performance/baselines
            tests/performance/policies
          if-no-files-found: warn
