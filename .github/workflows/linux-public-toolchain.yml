name: v032-native-strict-qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact full candidate commit to qualify
        required: true
        type: string
      lane:
        description: Qualification lane
        type: choice
        default: strict
        options: [strict, strict-debian, normal, public]

permissions:
  contents: read

jobs:
  native-strict:
    if: ${{ inputs.lane == 'strict' || inputs.lane == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: recursive
      - name: Verify native target and immutable source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REF"
          test "$(uname -m)" = aarch64
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
      - name: Install diagnostic and PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libclang-rt-18-dev unixodbc-dev lsof postgresql postgresql-client
      - name: Build and verify the candidate normal runtime
        run: bash source/tools/ci/setup_normal_runtime.sh --install-dependencies
      - name: Run unchanged native strict pair
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: bash harness/.github/qualification/run_native_strict.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.github/qualification" "$RUNNER_TEMP/v032-native-evidence"
      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-native-arm64-strict-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v032-native-evidence
            ${{ runner.temp }}/arlen-normal-runtime
            ${{ runner.temp }}/native-thread/**/manifest.json
            ${{ runner.temp }}/native-thread/**/identity.json
            ${{ runner.temp }}/native-thread/**/build.log
          include-hidden-files: true
          if-no-files-found: error

  native-debian-strict:
    if: ${{ inputs.lane == 'strict-debian' }}
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    timeout-minutes: 150
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: recursive
      - name: Verify native target and immutable source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REF"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID:$VERSION_ID" = debian:13
      - name: Install diagnostic and PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unixodbc-dev lsof postgresql postgresql-client
      - name: Build and verify the candidate normal runtime
        run: bash source/tools/ci/setup_normal_runtime.sh --install-dependencies
      - name: Run unchanged native strict pair
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: bash harness/.github/qualification/run_native_strict.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.github/qualification" "$RUNNER_TEMP/v032-native-evidence"
      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-native-debian-strict-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v032-native-evidence
            ${{ runner.temp }}/arlen-normal-runtime
            ${{ runner.temp }}/native-thread/**/manifest.json
            ${{ runner.temp }}/native-thread/**/identity.json
            ${{ runner.temp }}/native-thread/**/build.log
          include-hidden-files: true
          if-no-files-found: error

  native-normal:
    if: ${{ inputs.lane == 'normal' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          submodules: recursive
      - name: Verify native target and immutable source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REF"
          test "$(uname -m)" = aarch64
          . /etc/os-release
          test "$ID:$VERSION_ID" = ubuntu:24.04
      - name: Install diagnostic and PostgreSQL prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unixodbc-dev lsof postgresql postgresql-client
      - name: Build and verify the candidate normal runtime
        run: bash source/tools/ci/setup_normal_runtime.sh --install-dependencies
      - name: Run full native normal unit, integration, and HTTP checks
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: bash harness/.github/qualification/run_native_normal.sh "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/harness/.github/qualification" "$RUNNER_TEMP/v032-native-normal-evidence"
      - name: Preserve native qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-native-arm64-normal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v032-native-normal-evidence
            ${{ runner.temp }}/arlen-normal-runtime
          include-hidden-files: true
          if-no-files-found: error

  native-public:
    if: ${{ inputs.lane == 'public' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@v4
        with:
          path: harness
      - name: Verify completed public latest before installing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          gh api repos/danjboyd/Arlen/releases/latest > "$RUNNER_TEMP/public-latest.json"
          python3 - "$RUNNER_TEMP/public-latest.json" <<'PYCODE'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['tag_name']=='v0.3.2' and not r['draft'] and not r['prerelease']
          assert {a['name'] for a in r['assets']}=={'arlen-0.3.2.tar.gz','arlen-0.3.2-macos-arm64.tar.gz','arlen-0.3.2-windows-x64.zip','install.sh','install.ps1','SHA256SUMS'}
          PYCODE
      - name: Actual public latest on cold native Ubuntu 24.04 ARM64
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          mkdir "$RUNNER_TEMP/v032-public-evidence"
          docker run --rm --cpus=4 --memory=12g --pids-limit=2048 \
            -e SOURCE_REF="$SOURCE_REF" \
            -v "$GITHUB_WORKSPACE/harness/.github/qualification:/harness:ro" \
            -v "$RUNNER_TEMP/v032-public-evidence:/evidence" \
            ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac bash -c '
              set -euo pipefail
              test "$(uname -m)" = aarch64
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git sudo python3
              useradd --create-home --shell /bin/bash arlen
              echo "arlen ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/arlen
              chown arlen:arlen /evidence
              test ! -e /usr/GNUstep
              sudo -u arlen -H python3 /harness/verify_public_unix.py --expected-version 0.3.2 --expected-source "$SOURCE_REF" --output /evidence/actual-public
            '
      - name: Restore ownership of the owned container evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/v032-public-evidence" ]]; then
            sudo chown -R --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/v032-public-evidence"
          fi
      - name: Preserve actual public installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v032-native-arm64-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v032-public-evidence/actual-public/*.log
            ${{ runner.temp }}/v032-public-evidence/actual-public/summary.json
            ${{ runner.temp }}/v032-public-evidence/actual-public/normal-provenance.json
            ${{ runner.temp }}/v032-public-evidence/actual-public/native-normal-controls
            ${{ runner.temp }}/public-latest.json
          if-no-files-found: error
