name: linux-public-toolchain

# Runs the public Linux installer in clean containers. It builds the pinned
# patched runtime natively at its final prefix, installs a source archive, serves
# a new app and runs native concurrency controls. The ordinary user has no
# /usr/GNUstep. It is not a merge-gate lane; see docs/CI_ALIGNMENT.md.

on:
  pull_request:
    paths:
      - "tools/install.sh"
      - "tools/setup_runtime.py"
      - "tools/runtime/**"
      - "tools/ci/tsan-toolchain/**"
      - "tests/fixtures/sanitizers/tsan_runtime_probe.m"
      - "bin/**"
      - "tools/release/**"
      - "tools/source_gnustep_env.sh"
      - "tools/resolve_gnustep.sh"
      - "GNUmakefile"
      - ".github/workflows/linux-public-toolchain.yml"
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-toolchain:
    name: linux-public-toolchain / ${{ matrix.image }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:13", arch: amd64, runner: ubuntu-latest }
          - { image: "debian:13", arch: arm64, runner: ubuntu-24.04-arm }
          - { image: "ubuntu:26.04", arch: amd64, runner: ubuntu-latest }
    steps:
      - name: Install base packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git sudo

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash arlen
          echo 'arlen ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/arlen
          git config --system --add safe.directory '*'
          chown -R arlen:arlen "$GITHUB_WORKSPACE"

      - name: Package Arlen and smoke-test the install
        run: |
          sudo -u arlen -H bash -c 'set -euo pipefail
            cd "$0"
            test ! -e /usr/GNUstep
            bash tools/release/package_framework.sh --version 0.0.0 --kind source --out "$HOME/dist"
            export ARLEN_RUNTIME_EVIDENCE_DIR="$0/build/native-runtime-evidence"
            bash tools/release/smoke_install.sh "$HOME/dist/arlen-0.0.0.tar.gz"' \
            "$GITHUB_WORKSPACE"

      - name: Runtime delivery regression checks
        run: python3 tools/ci/test_runtime_delivery.py

      - name: Upload native runtime provenance and controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ matrix.arch }}-${{ strategy.job-index }}
          path: build/native-runtime-evidence
          if-no-files-found: warn
