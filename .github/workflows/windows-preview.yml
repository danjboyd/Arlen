name: windows-preview

on:
  push:
    branches:
      - windows-clang64-integration
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    # The runner is a persistent self-hosted VM: never run fork pull requests
    # on it (this repository is public). Same-repository PRs, pushes and manual
    # dispatches still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, arlen, msys2-clang64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record GNUstep CLI provisioning pin
        shell: powershell
        run: |
          git -C vendor\gnustep-cli-new rev-parse HEAD
          if (!(Test-Path vendor\gnustep-cli-new\docs\windows-integration.md)) {
            throw "missing vendored gnustep-cli-new Windows integration docs"
          }

      # Covers development/watch/jobs smoke and rejection of unsupported propane
      # startup; independent Windows workers must never share a listen port.
      - name: Run Windows preview runtime parity lane
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\run_clang64.ps1 -InnerCommand "bash ./tools/ci/run_windows_preview.sh"

      # 0.3.0 makes Windows a development platform. `make windows-confidence`
      # (packaged release, deploy doctor, propane, jobs-worker) is production
      # deploy coverage, deferred to 0.4.0 with Windows production (#200).
      # Includes a sparse >2 GiB file to verify the shared 64-bit offset ABI.
      - name: Run unit tests
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\run_clang64.ps1 -InnerCommand "make test-unit"

      - name: Run Windows static and realtime transport regressions
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\run_clang64.ps1 -InnerCommand "make test-integration-filter TEST=HTTPIntegrationTests/testRealtimeOriginsReceiveOnlyChannelsAndWindowsStaticPaths"
          powershell -ExecutionPolicy Bypass -File scripts\run_clang64.ps1 -InnerCommand "make test-integration-filter TEST=HTTPIntegrationTests/testStaticHTTPValidatorsHeadAndRanges"

      - name: Upload Windows preview artifacts
        if: github.event_name == 'workflow_dispatch' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-artifacts-${{ github.run_id }}
          path: |
            build/phase24
            build/tests
            test-results
          if-no-files-found: warn
