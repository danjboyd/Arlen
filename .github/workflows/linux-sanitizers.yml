name: linux-sanitizers

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer-gate:
    name: linux-sanitizers / sanitizer-gate
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # iep-apt's /tmp is a small shared tmpfs, and GNUstep's NSTemporaryDirectory()
      # reads TEMP/TMP (not TMPDIR). Give each job its own on-disk temp directory,
      # which the runner empties between jobs, so leaked test files can't fill /tmp.
      - name: Use a per-job temp directory
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/tmp"
          {
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "TMP=$RUNNER_TEMP/tmp"
            echo "TEMP=$RUNNER_TEMP/tmp"
          } >>"$GITHUB_ENV"

      - name: Install build dependencies
        env:
          ARLEN_CI_GNUSTEP_STRATEGY: preinstalled
        run: |
          bash ./tools/ci/install_ci_dependencies.sh

      - name: Run linux sanitizer matrix gate
        env:
          GNUSTEP_USER_ROOT: ${{ github.workspace }}/.gnustep
          ARLEN_PHASE10M_INCLUDE_THREAD_NIGHTLY: "0"
          ARLEN_PERF_RETRY_COUNT: "3"
        run: |
          bash ./tools/ci/run_linux_sanitizer_matrix.sh

      - name: Summarize XCTest results
        if: always()
        run: |
          python3 ./tools/ci/junit_report.py test-results --title "linux-sanitizers XCTest results"

      - name: Upload sanitizer confidence artifacts
        if: github.event_name == 'workflow_dispatch' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-sanitizers-artifacts-${{ github.run_id }}
          path: |
            build/release_confidence/phase10m/sanitizers/**
            build/release_confidence/phase10m/backend_parity/**
            build/release_confidence/phase10m/protocol_adversarial/**
            build/release_confidence/phase10m/syscall_faults/**
            build/release_confidence/phase10m/allocation_faults/**
            build/release_confidence/phase10m/soak/**
            build/release_confidence/phase10m/chaos_restart/**
            build/release_confidence/phase10m/static_analysis/**
            build/sanitizers/phase10m_thread_race/**
            test-results/**
          if-no-files-found: warn

  thread-race-nightly:
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    continue-on-error: true
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # iep-apt's /tmp is a small shared tmpfs, and GNUstep's NSTemporaryDirectory()
      # reads TEMP/TMP (not TMPDIR). Give each job its own on-disk temp directory,
      # which the runner empties between jobs, so leaked test files can't fill /tmp.
      - name: Use a per-job temp directory
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/tmp"
          {
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "TMP=$RUNNER_TEMP/tmp"
            echo "TEMP=$RUNNER_TEMP/tmp"
          } >>"$GITHUB_ENV"

      - name: Install build dependencies
        env:
          ARLEN_CI_GNUSTEP_STRATEGY: preinstalled
        run: |
          bash ./tools/ci/install_ci_dependencies.sh

      - name: Run nightly thread-race lane
        env:
          GNUSTEP_USER_ROOT: ${{ github.workspace }}/.gnustep
        run: |
          bash ./tools/ci/run_linux_thread_race_nightly.sh

      - name: Upload thread-race nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-thread-race-nightly-${{ github.run_id }}
          path: build/sanitizers/phase10m_thread_race/**
          if-no-files-found: warn

  # Issue 271: the integration suite under ASAN+UBSan. Nightly only (one
  # self-hosted runner can't take a sanitized integration run on every PR),
  # and not a required check. A finding here becomes a release-blocking issue.
  integration-sanitizers-nightly:
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    continue-on-error: true
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # iep-apt's /tmp is a small shared tmpfs, and GNUstep's NSTemporaryDirectory()
      # reads TEMP/TMP (not TMPDIR). Give each job its own on-disk temp directory,
      # which the runner empties between jobs, so leaked test files can't fill /tmp.
      - name: Use a per-job temp directory
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/tmp"
          {
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "TMP=$RUNNER_TEMP/tmp"
            echo "TEMP=$RUNNER_TEMP/tmp"
          } >>"$GITHUB_ENV"

      - name: Install build dependencies
        env:
          ARLEN_CI_GNUSTEP_STRATEGY: preinstalled
        run: |
          bash ./tools/ci/install_ci_dependencies.sh

      - name: Run nightly integration sanitizer lane
        env:
          GNUSTEP_USER_ROOT: ${{ github.workspace }}/.gnustep
        run: |
          bash ./tools/ci/run_linux_integration_sanitizers_nightly.sh

      - name: Summarize XCTest results
        if: always()
        run: |
          python3 ./tools/ci/junit_report.py test-results --title "integration sanitizers (nightly) XCTest results"

      - name: Upload integration sanitizer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-integration-sanitizers-nightly-${{ github.run_id }}
          path: |
            build/sanitizers/integration_nightly/**
            test-results/**
          if-no-files-found: warn
