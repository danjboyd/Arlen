name: docs-quality

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-gate:
    name: docs-quality / docs-gate
    runs-on: [self-hosted, Linux, X64, arlen, iep-apt]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # iep-apt's /tmp is a small shared tmpfs, and GNUstep's NSTemporaryDirectory()
      # reads TEMP/TMP (not TMPDIR). Give each job its own on-disk temp directory,
      # which the runner empties between jobs, so leaked test files can't fill /tmp.
      - name: Use a per-job temp directory
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/tmp"
          {
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "TMP=$RUNNER_TEMP/tmp"
            echo "TEMP=$RUNNER_TEMP/tmp"
          } >>"$GITHUB_ENV"

      - name: Install build dependencies
        env:
          ARLEN_CI_GNUSTEP_STRATEGY: preinstalled
        run: |
          bash ./tools/ci/install_ci_dependencies.sh

      - name: Run docs quality gate
        env:
          GNUSTEP_USER_ROOT: ${{ github.workspace }}/.gnustep
        run: |
          bash ./tools/ci/run_docs_quality.sh

      - name: Upload docs artifacts
        if: github.event_name == 'workflow_dispatch' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-artifacts-${{ github.run_id }}
          path: |
            build/docs
          if-no-files-found: warn
